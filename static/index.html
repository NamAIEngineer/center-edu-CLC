<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Center EDU — Academic Operations</title>
  <link rel="stylesheet" href="/fonts/montserrat/observed-500.css">
  <link rel="stylesheet" href="/fonts/reference-icons/observed-icons.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app" class="app-shell">
    <section id="login-view" class="login-layout">
      <div class="login-card">
      <div class="login-logo" aria-label="CENTER ONLINE"><img src="/images/reference-login-logo.png" alt="CENTER ONLINE"></div>
        <form id="login-form" class="stack">
          <label>Tài khoản<input name="login" autocomplete="username" placeholder="Tài khoản" required></label>
          <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required></label>
          <div class="login-actions"><label class="remember-login"><input id="remember-login" type="checkbox"> <span>Lưu tài khoản</span></label><button class="primary" type="submit">Đăng nhập</button></div>
          <p id="login-error" class="error" role="alert"></p>
        </form>
        <p class="login-support">Số tổng đài 1900 0362</p>
        <p class="login-copyright">2018 © CenterOnline - 2.0.1.3.</p>
      </div>
      <div class="login-aside" aria-hidden="true"><div class="orb"></div></div>
    </section>
    <section id="main-view" data-screen="training-dashboard" data-route="/dashboard/training" hidden>
      <header class="topbar">
        <div class="topbar-left"><button id="sidebar-toggle" class="icon-button" aria-label="Mở menu">☰</button><div class="brand-mark" aria-label="CENTER ONLINE"><img src="/images/reference-logo.png" alt="CENTER ONLINE"></div><button class="center-selector" type="button"><span class="center-selector-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9H5a2 2 0 0 1-2-2v-7ZM9 20v-6h6v6"/></svg></span><span>Trung tâm CenterOnline - Demo</span><span aria-hidden="true">⌄</span></button><label id="branch-manager-scope" class="branch-manager-scope" role="group" aria-label="Phạm vi chi nhánh" hidden><span>Chi nhánh</span><select aria-label="Phạm vi chi nhánh"></select><small data-branch-manager-status></small></label></div>
        <div class="topbar-actions" aria-label="Thanh công cụ"><button class="topbar-icon" title="Gọi" aria-label="Gọi"><i class="reference-flaticon flaticon-support" aria-hidden="true"></i><sup>0</sup></button><button class="topbar-icon" title="Tổng đài" aria-label="Tổng đài"><i class="reference-la la-tty" aria-hidden="true"></i></button><button class="topbar-icon" title="Tìm kiếm" aria-label="Tìm kiếm"><i class="reference-flaticon flaticon-search-1" aria-hidden="true"></i></button><button class="topbar-icon" title="Hỗ trợ" aria-label="Hỗ trợ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.3 1.8c-1.1 1-1.8 1.4-1.8 3.2M12 17h.01"/></svg></button><button class="topbar-icon" title="Thông báo" aria-label="Thông báo"><i class="reference-flaticon flaticon-alert-2" aria-hidden="true"></i><sup>0</sup></button><button class="topbar-icon" title="Lịch" aria-label="Lịch"><i class="reference-fa fa-calendar" aria-hidden="true"></i><sup>0</sup></button><button class="language-button" type="button" aria-label="Ngôn ngữ">VI</button><details class="avatar-menu"><summary aria-label="Tài khoản"><span class="avatar-circle">●</span></summary><div class="avatar-dropdown"><div class="avatar-head"><b data-user-name>—</b><small data-user-role></small></div><button type="button" data-act="profile">Hồ sơ cá nhân</button><button type="button" data-act="password">Đổi mật khẩu</button><button type="button" data-act="about">Về Center EDU</button><button type="button" data-act="privacy">Chính sách bảo mật</button><button type="button" data-act="report">Báo lỗi hệ thống</button><button id="logout" type="button">Thoát</button></div></details></div>
      </header>
      <div class="body-layout">
        <aside class="sidebar" id="sidebar"><nav id="reference-nav" aria-label="Điều hướng chính"></nav><div class="sidebar-bottom"><span class="status-dot"></span> Dữ liệu đang đồng bộ</div></aside>
        <main class="content"><div class="breadcrumb" id="breadcrumb">Trang chủ</div><div id="toast" class="toast" role="status"></div><div id="screen"></div></main>
      </div>
    </section>
  </div>
  <script src="/nav-config.js" defer></script>
  <script src="/observed-route-titles.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
