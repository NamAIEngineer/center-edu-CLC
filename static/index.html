<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Center EDU — Academic Operations</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app" class="app-shell">
    <section id="login-view" class="login-layout">
      <div class="login-card">
        <div class="login-logo" aria-label="CENTER EDU"><span>CENTER</span><span>EDU</span></div>
        <form id="login-form" class="stack">
          <label>Tài khoản<input name="login" autocomplete="username" placeholder="username hoặc email" required></label>
          <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required></label>
          <div class="login-actions"><label class="remember-login"><input id="remember-login" type="checkbox"> <span>Lưu tài khoản</span></label><button class="primary" type="submit">Đăng nhập</button></div>
          <p id="login-error" class="error" role="alert"></p>
        </form>
        <p class="login-support">Workspace điều hành đào tạo</p>
      </div>
      <div class="login-aside" aria-hidden="true"><div class="orb"></div></div>
    </section>
    <section id="main-view" data-screen="training-dashboard" data-route="/dashboard/training" hidden>
      <header class="topbar">
        <div class="topbar-left"><button id="sidebar-toggle" class="icon-button" aria-label="Mở menu">☰</button><div class="brand-mark" aria-label="CENTER EDU">CENTER<span>EDU</span></div><button class="center-selector" type="button"><span class="center-selector-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9H5a2 2 0 0 1-2-2v-7ZM9 20v-6h6v6"/></svg></span><span>Trung tâm Center EDU - Demo</span><span aria-hidden="true">⌄</span></button></div>
        <div class="topbar-actions" aria-label="Thanh công cụ"><button class="topbar-icon" title="Gọi" aria-label="Gọi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2 2a14 14 0 0 0 5 5l2-2 5 2v3c0 1-1 2-2 2C10 21 3 14 3 6c0-1 1-2 2-2Z"/></svg><sup>0</sup></button><button class="topbar-icon" title="Tổng đài" aria-label="Tổng đài"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v11H4zM8 21h8M12 17v4"/></svg></button><button class="topbar-icon" title="Tìm kiếm" aria-label="Tìm kiếm"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/></svg></button><button class="topbar-icon" title="Hỗ trợ" aria-label="Hỗ trợ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.3 1.8c-1.1 1-1.8 1.4-1.8 3.2M12 17h.01"/></svg></button><button class="topbar-icon" title="Thông báo" aria-label="Thông báo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><sup>0</sup></button><button class="topbar-icon" title="Lịch" aria-label="Lịch"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><sup>0</sup></button><button class="language-button" type="button" aria-label="Ngôn ngữ">VI</button><details class="avatar-menu"><summary aria-label="Tài khoản"><span class="avatar-circle">●</span></summary><div class="avatar-dropdown"><button type="button">Hồ sơ cá nhân</button><button type="button">Đổi mật khẩu</button><button id="logout" type="button">Thoát</button></div></details></div>
      </header>
      <div class="body-layout">
        <aside class="sidebar" id="sidebar"><nav id="reference-nav" aria-label="Điều hướng chính"></nav><div class="sidebar-bottom"><span class="status-dot"></span> Dữ liệu đang đồng bộ</div></aside>
        <main class="content"><div class="breadcrumb" id="breadcrumb">Trang chủ</div><div id="toast" class="toast" role="status"></div><div id="screen"></div></main>
      </div>
    </section>
  </div>
  <script src="/nav-config.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
